
name: BIAN AI Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'bian-ai-base.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract BIAN AI
        run: |
          mkdir -p app
          unzip -o bian-ai-base.zip -d app

      - name: Find and Install Dependencies
        run: |
          PACKAGE=$(find app -name package.json -type f | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json tidak ditemukan di dalam ZIP!"
            find app -maxdepth 4 -type f
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE")
          echo "Project ditemukan: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

          cd "$APP_DIR"
          npm install

      - name: Verify Project
        run: |
          cd "$APP_DIR"
          npm run

      - name: Upload Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bian-ai-source
          path: app/
